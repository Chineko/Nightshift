name: Apply overlay input once

on:
  push:
    branches:
      - prototype/integrated-mvp

permissions:
  contents: write

jobs:
  apply-overlay-input:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install Linux system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libopenxr-dev pkg-config
      - name: Add controller input module
        shell: bash
        run: |
          cat > crates/nightshift-overlay-prototype/src/controller_input.rs <<'RUST'
          use anyhow::{Context, Result};
          use openxr as xr;

          use crate::{interaction::PanelRay, placement::normalize_quaternion_xyzw};

          #[derive(Clone, Copy, Debug, PartialEq, Eq)]
          pub enum ControllerHand {
              Left,
              Right,
          }

          #[derive(Clone, Copy, Debug, PartialEq)]
          pub struct PointerSample {
              pub hand: ControllerHand,
              pub ray: Option<PanelRay>,
              pub just_pressed: bool,
          }

          pub struct ControllerInput {
              action_set: xr::ActionSet,
              left_aim: xr::Action<xr::Posef>,
              right_aim: xr::Action<xr::Posef>,
              left_select: xr::Action<bool>,
              right_select: xr::Action<bool>,
              left_space: xr::Space,
              right_space: xr::Space,
          }

          impl ControllerInput {
              pub fn new(instance: &xr::Instance, session: &xr::Session<xr::Vulkan>) -> Result<Self> {
                  let action_set = instance
                      .create_action_set("nightshift_panel", "Nightshift panel", 0)
                      .context("creating Nightshift panel action set")?;
                  let left_aim = action_set
                      .create_action::<xr::Posef>("left_aim", "Left pointer", &[])
                      .context("creating left pointer pose action")?;
                  let right_aim = action_set
                      .create_action::<xr::Posef>("right_aim", "Right pointer", &[])
                      .context("creating right pointer pose action")?;
                  let left_select = action_set
                      .create_action::<bool>("left_select", "Left select", &[])
                      .context("creating left select action")?;
                  let right_select = action_set
                      .create_action::<bool>("right_select", "Right select", &[])
                      .context("creating right select action")?;

                  let simple_profile = instance
                      .string_to_path("/interaction_profiles/khr/simple_controller")
                      .context("resolving simple-controller interaction profile")?;
                  instance
                      .suggest_interaction_profile_bindings(
                          simple_profile,
                          &[
                              xr::Binding::new(
                                  &left_aim,
                                  instance.string_to_path("/user/hand/left/input/aim/pose")?,
                              ),
                              xr::Binding::new(
                                  &right_aim,
                                  instance.string_to_path("/user/hand/right/input/aim/pose")?,
                              ),
                              xr::Binding::new(
                                  &left_select,
                                  instance.string_to_path("/user/hand/left/input/select/click")?,
                              ),
                              xr::Binding::new(
                                  &right_select,
                                  instance.string_to_path("/user/hand/right/input/select/click")?,
                              ),
                          ],
                      )
                      .context("suggesting simple-controller panel bindings")?;

                  session
                      .attach_action_sets(&[&action_set])
                      .context("attaching Nightshift panel action set")?;
                  let left_space = left_aim
                      .create_space(session, xr::Path::NULL, xr::Posef::IDENTITY)
                      .context("creating left pointer action space")?;
                  let right_space = right_aim
                      .create_space(session, xr::Path::NULL, xr::Posef::IDENTITY)
                      .context("creating right pointer action space")?;

                  Ok(Self {
                      action_set,
                      left_aim,
                      right_aim,
                      left_select,
                      right_select,
                      left_space,
                      right_space,
                  })
              }

              pub fn samples(
                  &self,
                  session: &xr::Session<xr::Vulkan>,
                  display_time: xr::Time,
                  base_space: &xr::Space,
              ) -> Result<[PointerSample; 2]> {
                  session
                      .sync_actions(&[(&self.action_set).into()])
                      .context("synchronizing Nightshift panel actions")?;

                  Ok([
                      sample_hand(
                          ControllerHand::Left,
                          &self.left_aim,
                          &self.left_select,
                          &self.left_space,
                          session,
                          display_time,
                          base_space,
                      )?,
                      sample_hand(
                          ControllerHand::Right,
                          &self.right_aim,
                          &self.right_select,
                          &self.right_space,
                          session,
                          display_time,
                          base_space,
                      )?,
                  ])
              }
          }

          fn sample_hand(
              hand: ControllerHand,
              aim: &xr::Action<xr::Posef>,
              select: &xr::Action<bool>,
              space: &xr::Space,
              session: &xr::Session<xr::Vulkan>,
              display_time: xr::Time,
              base_space: &xr::Space,
          ) -> Result<PointerSample> {
              let select_state = select
                  .state(session, xr::Path::NULL)
                  .context("reading controller select action")?;
              let just_pressed = select_state.is_active
                  && select_state.changed_since_last_sync
                  && select_state.current_state;

              let ray = if aim.is_active(session, xr::Path::NULL)? {
                  let location = space
                      .locate(base_space, display_time)
                      .context("locating controller pointer")?;
                  let valid = location
                      .location_flags
                      .contains(xr::SpaceLocationFlags::POSITION_VALID)
                      && location
                          .location_flags
                          .contains(xr::SpaceLocationFlags::ORIENTATION_VALID);
                  valid.then(|| ray_from_pose(location.pose)).flatten()
              } else {
                  None
              };

              Ok(PointerSample {
                  hand,
                  ray,
                  just_pressed,
              })
          }

          fn ray_from_pose(pose: xr::Posef) -> Option<PanelRay> {
              let orientation = normalize_quaternion_xyzw([
                  pose.orientation.x,
                  pose.orientation.y,
                  pose.orientation.z,
                  pose.orientation.w,
              ])?;
              let direction = rotate([0.0, 0.0, -1.0], orientation);
              Some(PanelRay {
                  origin: [pose.position.x, pose.position.y, pose.position.z],
                  direction,
              })
          }

          fn rotate(vector: [f32; 3], quaternion_xyzw: [f32; 4]) -> [f32; 3] {
              let [x, y, z, w] = quaternion_xyzw;
              let q_vector = [x, y, z];
              let twice_cross = [
                  2.0 * (q_vector[1] * vector[2] - q_vector[2] * vector[1]),
                  2.0 * (q_vector[2] * vector[0] - q_vector[0] * vector[2]),
                  2.0 * (q_vector[0] * vector[1] - q_vector[1] * vector[0]),
              ];
              let cross_q_twice_cross = [
                  q_vector[1] * twice_cross[2] - q_vector[2] * twice_cross[1],
                  q_vector[2] * twice_cross[0] - q_vector[0] * twice_cross[2],
                  q_vector[0] * twice_cross[1] - q_vector[1] * twice_cross[0],
              ];
              [
                  vector[0] + w * twice_cross[0] + cross_q_twice_cross[0],
                  vector[1] + w * twice_cross[1] + cross_q_twice_cross[1],
                  vector[2] + w * twice_cross[2] + cross_q_twice_cross[2],
              ]
          }
          RUST
      - name: Wire input and visible controls
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, got {count}")
              return text.replace(old, new, 1)

          main_path = Path("crates/nightshift-overlay-prototype/src/main.rs")
          main = main_path.read_text()
          main = replace_once(main, "mod content;\nmod panel;", "mod content;\nmod controller_input;\nmod interaction;\nmod panel;", "module declarations")
          main = replace_once(main, "    StateEvent, WorkerReport,\n", "    StateEvent, UiCommand, WorkerReport,\n", "UiCommand import")
          main = replace_once(main, "use content::PanelContent;\nuse panel::PanelRenderer;", "use content::PanelContent;\nuse controller_input::ControllerInput;\nuse interaction::{PanelAction, action_at_uv, hit_test_panel};\nuse panel::{PANEL_HEIGHT_M, PANEL_WIDTH_M, PanelRenderer};", "overlay imports")
          main = replace_once(main, "    let (updates_tx, updates_rx) = mpsc::channel();\n    let (reports_tx, reports_rx) = mpsc::channel();\n    spawn_ipc_client(running.clone(), updates_tx, reports_rx, hydra_mode);\n\n    run_overlay(running, updates_rx, reports_tx, placement, hydra_mode)", "    let (updates_tx, updates_rx) = mpsc::channel();\n    let (reports_tx, reports_rx) = mpsc::channel();\n    let (commands_tx, commands_rx) = mpsc::channel();\n    spawn_ipc_client(running.clone(), updates_tx, reports_rx, commands_rx, hydra_mode);\n\n    run_overlay(running, updates_rx, reports_tx, commands_tx, placement, hydra_mode)", "main channels")
          main = replace_once(main, "    reports: Receiver<WorkerReport>,\n    hydra_mode: bool,\n) {", "    reports: Receiver<WorkerReport>,\n    commands: Receiver<UiCommand>,\n    hydra_mode: bool,\n) {", "spawn IPC signature")
          main = replace_once(main, "run_ipc_connection(stream, &updates, &reports, &running, hydra_mode)", "run_ipc_connection(stream, &updates, &reports, &commands, &running, hydra_mode)", "IPC call")
          main = replace_once(main, "                    }\n                }\n                let _ = updates.send(RuntimeUpdate::Surface(hidden_surface_target()));", "                    }\n                }\n                while commands.try_recv().is_ok() {}\n                let _ = updates.send(RuntimeUpdate::Surface(hidden_surface_target()));", "disconnect drain")
          main = replace_once(main, "fn flush_worker_reports(\n    writer: &mut UnixStream,\n    reports: &Receiver<WorkerReport>,\n    hydra_mode: bool,\n) -> Result<()> {", "fn flush_client_messages(\n    writer: &mut UnixStream,\n    reports: &Receiver<WorkerReport>,\n    commands: &Receiver<UiCommand>,\n    hydra_mode: bool,\n) -> Result<()> {", "flush signature")
          main = replace_once(main, "    while let Ok(report) = reports.try_recv() {\n        if hydra_mode {\n            println!(\"[Hydra/Pose] report={report:?}\");\n        }\n        write_client_message(writer, &ClientMessage::Report { report })?;\n    }\n    Ok(())", "    while let Ok(report) = reports.try_recv() {\n        if hydra_mode {\n            println!(\"[Hydra/Pose] report={report:?}\");\n        }\n        write_client_message(writer, &ClientMessage::Report { report })?;\n    }\n    while let Ok(command) = commands.try_recv() {\n        if hydra_mode {\n            println!(\"[Hydra/Input] daemon command={command:?}\");\n        }\n        write_client_message(writer, &ClientMessage::Command { command })?;\n    }\n    Ok(())", "flush commands")
          main = replace_once(main, "    reports: &Receiver<WorkerReport>,\n    running: &AtomicBool,", "    reports: &Receiver<WorkerReport>,\n    commands: &Receiver<UiCommand>,\n    running: &AtomicBool,", "connection signature")
          main = replace_once(main, "flush_worker_reports(&mut writer, reports, hydra_mode)?;", "flush_client_messages(&mut writer, reports, commands, hydra_mode)?;", "flush call")
          main = replace_once(main, "fn report_pose(reports: &Sender<WorkerReport>, pose: SleepingPose) {\n    let _ = reports.send(WorkerReport::SleepingPose { pose });\n}\n\n#[allow(clippy::too_many_lines)]", "fn report_pose(reports: &Sender<WorkerReport>, pose: SleepingPose) {\n    let _ = reports.send(WorkerReport::SleepingPose { pose });\n}\n\nfn panel_command(action: PanelAction, current_brightness: f32) -> UiCommand {\n    match action {\n        PanelAction::EnterSleep => UiCommand::EnterSleep,\n        PanelAction::Wake => UiCommand::Wake,\n        PanelAction::BrightnessDown => {\n            UiCommand::SetBrightness(sanitize_brightness(current_brightness - 0.1))\n        }\n        PanelAction::BrightnessUp => {\n            UiCommand::SetBrightness(sanitize_brightness(current_brightness + 0.1))\n        }\n    }\n}\n\n#[allow(clippy::too_many_lines)]", "panel command helper")
          main = replace_once(main, "    reports: Sender<WorkerReport>,\n    placement: u32,", "    reports: Sender<WorkerReport>,\n    commands: Sender<UiCommand>,\n    placement: u32,", "run overlay signature")
          main = replace_once(main, "        let view_space = session\n            .create_reference_space(xr::ReferenceSpaceType::VIEW, xr::Posef::IDENTITY)\n            .context(\"creating VIEW reference space\")?;\n\n        let formats", "        let view_space = session\n            .create_reference_space(xr::ReferenceSpaceType::VIEW, xr::Posef::IDENTITY)\n            .context(\"creating VIEW reference space\")?;\n        let controller_input = match ControllerInput::new(&xr_instance, &session) {\n            Ok(input) => Some(input),\n            Err(error) => {\n                eprintln!(\"Nightshift panel controller input disabled: {error:#}\");\n                None\n            }\n        };\n\n        let formats", "controller setup")
          main = replace_once(main, "        let mut pose_tracker = PoseTracker::new(0);\n        let rect", "        let mut pose_tracker = PoseTracker::new(0);\n        let mut input_error_reported = false;\n        let rect", "input error state")
          main = replace_once(main, "            if let Some(report) = overlay_pose_report_if_changed(\n                &mut reported_saved_pose,\n                surface_controller.saved_pose(),\n            ) {\n                let _ = reports.send(report);\n            }\n\n            let now_ms", "            if let Some(report) = overlay_pose_report_if_changed(\n                &mut reported_saved_pose,\n                surface_controller.saved_pose(),\n            ) {\n                let _ = reports.send(report);\n            }\n\n            if let Some(controller_input) = controller_input.as_ref() {\n                match controller_input.samples(\n                    &session,\n                    frame_state.predicted_display_time,\n                    &local_space,\n                ) {\n                    Ok(samples) => {\n                        input_error_reported = false;\n                        if surface_target.visible {\n                            if let Some(panel_pose) = panel_pose {\n                                for sample in samples {\n                                    let Some(ray) = sample.ray else {\n                                        continue;\n                                    };\n                                    let Some(uv) = hit_test_panel(\n                                        ray,\n                                        panel_pose,\n                                        PANEL_WIDTH_M,\n                                        PANEL_HEIGHT_M,\n                                    ) else {\n                                        continue;\n                                    };\n                                    if sample.just_pressed {\n                                        if let Some(action) = action_at_uv(uv) {\n                                            if hydra_mode {\n                                                println!(\"[Hydra/Input] hand={:?} action={action:?} uv=({:.3},{:.3})\", sample.hand, uv.u, uv.v);\n                                            }\n                                            let _ = commands.send(panel_command(action, current_brightness));\n                                        }\n                                    }\n                                }\n                            }\n                        }\n                    }\n                    Err(error) if !input_error_reported => {\n                        eprintln!(\"Nightshift panel input sample failed: {error:#}\");\n                        input_error_reported = true;\n                    }\n                    Err(_) => {}\n                }\n            }\n\n            let now_ms", "frame input")
          main_path.write_text(main)

          raster_path = Path("crates/nightshift-overlay-prototype/src/raster.rs")
          raster = raster_path.read_text()
          raster = replace_once(raster, "const DIVIDER: [u8; 4] = [58, 61, 75, 255];\n", "const DIVIDER: [u8; 4] = [58, 61, 75, 255];\nconst BUTTON_FILL: [u8; 4] = [34, 36, 48, 255];\nconst BUTTON_BORDER: [u8; 4] = [92, 82, 122, 255];\nconst BUTTON_TEXT: [u8; 4] = [228, 220, 248, 255];\n", "button colors")
          raster = replace_once(raster, "        for (index, line) in content.lines.iter().skip(1).enumerate() {\n            bitmap.draw_text(36, 100 + index as u32 * 60, line, 3, TEXT);\n        }\n        bitmap\n    }\n\n    fn fill(&mut self, color: [u8; 4]) {", "        for (index, line) in content.lines.iter().skip(1).enumerate() {\n            bitmap.draw_text(36, 100 + index as u32 * 60, line, 3, TEXT);\n        }\n        bitmap.draw_button(36, 388, 165, 44, \"SLEEP\");\n        bitmap.draw_button(213, 388, 165, 44, \"WAKE\");\n        bitmap.draw_button(390, 388, 165, 44, \"DARKER\");\n        bitmap.draw_button(567, 388, 165, 44, \"BRIGHT\");\n        bitmap\n    }\n\n    fn draw_button(&mut self, x: u32, y: u32, width: u32, height: u32, label: &str) {\n        self.fill_rect(x, y, width, height, BUTTON_BORDER);\n        self.fill_rect(\n            x + 2,\n            y + 2,\n            width.saturating_sub(4),\n            height.saturating_sub(4),\n            BUTTON_FILL,\n        );\n        self.draw_text(x + 18, y + 11, label, 3, BUTTON_TEXT);\n    }\n\n    fn fill(&mut self, color: [u8; 4]) {", "button drawing")
          raster = replace_once(raster, "    #[test]\n    fn long_lines_clip_without_resizing_or_panicking() {", "    #[test]\n    fn raster_contains_visible_interaction_controls() {\n        let bitmap = PanelBitmap::from_content(&PanelContent::from_state(&AppState::default()));\n        assert!(bitmap.rgba.chunks_exact(4).any(|pixel| pixel == BUTTON_FILL));\n        assert!(bitmap.rgba.chunks_exact(4).any(|pixel| pixel == BUTTON_BORDER));\n        assert!(bitmap.rgba.chunks_exact(4).any(|pixel| pixel == BUTTON_TEXT));\n    }\n\n    #[test]\n    fn long_lines_clip_without_resizing_or_panicking() {", "button raster test")
          raster_path.write_text(raster)
          PY
      - name: Test overlay input slice
        run: |
          cargo test -p nightshift-overlay-prototype --locked
          cargo clippy -p nightshift-overlay-prototype --all-targets --locked -- -D warnings
      - name: Commit tested overlay input
        shell: bash
        run: |
          git rm .github/workflows/apply-overlay-input-once.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/nightshift-overlay-prototype
          git commit -m "Wire controller input to overlay controls"
          git push origin HEAD:prototype/integrated-mvp
