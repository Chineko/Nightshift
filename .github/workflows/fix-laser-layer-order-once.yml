name: Fix laser layer order once

on:
  push:
    branches:
      - prototype/integrated-mvp

permissions:
  contents: write

jobs:
  fix-laser-layer-order:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Install Linux system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libopenxr-dev pkg-config
      - name: Put laser above panel
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/nightshift-overlay-prototype/src/main.rs')
          text = path.read_text()
          old = '&[&layer, &laser_layers[0], &laser_layers[1], &panel_layer]'
          new = '&[&layer, &panel_layer, &laser_layers[0], &laser_layers[1]]'
          if text.count(old) != 1:
              raise SystemExit(f'layer-order guard failed: expected 1 match, got {text.count(old)}')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          rm -f .github/workflows/fix-laser-layer-order-once.yml
      - name: Format and test overlay
        run: |
          rustfmt --edition 2024 crates/nightshift-overlay-prototype/src/main.rs
          cargo test --manifest-path crates/nightshift-overlay-prototype/Cargo.toml
          cargo clippy --manifest-path crates/nightshift-overlay-prototype/Cargo.toml --all-targets
          git diff --check
      - name: Commit tested fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/nightshift-overlay-prototype/src/main.rs .github/workflows/fix-laser-layer-order-once.yml
          git commit -m 'Render overlay laser above panel'
          git push
