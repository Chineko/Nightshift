name: Temporary Daemon Split

on:
  push:
    branches:
      - prototype/refactor-daemon-generator

permissions:
  contents: write

jobs:
  split:
    if: github.event.head_commit.message == 'Arm disposable daemon split workflow'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: prototype/refactor-daemon-generator

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libopenxr-dev pkg-config

      - name: Split daemon source
        run: python .github/tmp-daemon-split.py

      - name: Validate daemon split
        shell: bash
        run: |
          set -o pipefail
          cargo check -p nightshift-daemon --all-targets --locked 2>&1 | tee daemon-split.log
          cargo test -p nightshift-daemon --locked 2>&1 | tee -a daemon-split.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daemon-split-diagnostics
          path: daemon-split.log
          if-no-files-found: ignore

      - name: Commit generated source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/nightshift-daemon/src
          git commit -m 'Split daemon state and IPC modules'
          git push origin HEAD:prototype/refactor-daemon-generator
