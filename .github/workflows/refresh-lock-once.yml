name: Refresh Cargo lock once

on:
  push:
    branches:
      - prototype/integrated-mvp

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Regenerate Cargo.lock
        run: cargo generate-lockfile
      - name: Verify lock-only change
        shell: bash
        run: |
          changed="$(git status --short)"
          if [[ -z "$changed" ]]; then
            echo "Cargo.lock is already current."
            exit 0
          fi
          if [[ "$(git diff --name-only)" != "Cargo.lock" ]]; then
            echo "Refusing to commit non-lockfile changes:" >&2
            git status --short >&2
            exit 1
          fi
          git diff --check -- Cargo.lock
      - name: Commit refreshed lockfile
        shell: bash
        run: |
          if git diff --quiet -- Cargo.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "Refresh lockfile for native clipboard"
          git push origin HEAD:prototype/integrated-mvp
