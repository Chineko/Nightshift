name: Apply overlay grab retry

on:
  push:
    branches:
      - prototype/integrated-mvp

permissions:
  contents: write

jobs:
  apply-overlay-grab:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Install Linux system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libopenxr-dev pkg-config
      - name: Extract guarded transforms with bounded input block
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          helper = Path('.github/workflows/apply-overlay-grab-once.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(helper) if line.strip() == "python3 - <<'PY'") + 1
          end = next(i for i in range(start, len(helper)) if helper[i].strip() == 'PY')
          script_lines = [line[10:] if line.startswith('          ') else line for line in helper[start:end]]
          matches = [i for i, line in enumerate(script_lines) if "controller interaction loop" in line and 'replace_once' in line]
          if len(matches) != 1:
              raise SystemExit(f'controller interaction replacement: expected one line, got {len(matches)}')
          script_lines[matches[0]] = '''start_input = text.index("            if let Some(controller_input) = controller_input.as_ref() {")\nend_input = text.index("            let now_ms = pose_clock.elapsed().as_millis() as u64;", start_input)\ntext = text[:start_input] + new_input + "\\n" + text[end_input:]'''
          Path('/tmp/apply_overlay_grab.py').write_text('\n'.join(script_lines) + '\n')
          PY
          python3 /tmp/apply_overlay_grab.py
      - name: Format changed Rust files
        run: |
          rustfmt --edition 2024 \
            crates/nightshift-overlay-prototype/src/controller_input.rs \
            crates/nightshift-overlay-prototype/src/interaction.rs \
            crates/nightshift-overlay-prototype/src/surface.rs \
            crates/nightshift-overlay-prototype/src/main.rs \
            crates/nightshift-overlay-prototype/tests/interaction.rs
      - name: Test grab and move slice
        run: |
          cargo test -p nightshift-overlay --locked
          cargo clippy -p nightshift-overlay --all-targets --locked
          git diff --check
      - name: Commit tested grab and move
        shell: bash
        run: |
          git rm .github/workflows/apply-overlay-grab-once.yml .github/workflows/apply-overlay-grab-retry.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/nightshift-overlay-prototype
          git diff --cached --check
          git commit -m "Add controller grab and move for overlay panel"
          git push origin HEAD:prototype/integrated-mvp
