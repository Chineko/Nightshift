              'For a combined hardware smoke test, show the panel and confirm a visible laser appears while either controller is aimed at it. Hover each bottom-row button and confirm its highlight follows the target. Press trigger on `SLEEP`, `WAKE`, `DARKER`, and `BRIGHT`; trigger must activate UI only and must never move the panel. Then hold the controller grip/squeeze while aiming at the panel, move and rotate your hand in all axes, and release. The panel should follow the full 6DOF controller transform, remain world-locked and undimmed after release, and restore the committed pose after an overlay restart when `RestoreLastPosition` is used. With `--hydra`, the first successful interaction per overlay process emits the one-shot `I\'M FIRIN\' MAH LAZER` Easter egg; normal button and grab diagnostics remain secret-free.\n',
