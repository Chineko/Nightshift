              'The positioned panel renders live Nightshift status on a fixed-size dark surface and now includes four controller-selectable controls: `SLEEP`, `WAKE`, `DARKER`, and `BRIGHT`. Nightshift uses OpenXR aim poses plus the simple-controller select action, ray-tests the world-locked quad, and sends the resulting action through the same daemon command path used by the desktop UI. Misses and the gaps between buttons remain non-actions rather than snapping to a nearby control. Brightness buttons adjust the current canonical brightness in 10-percentage-point steps. If controller-action setup is unavailable on a runtime, the status panel continues rendering while interaction is disabled. The same select/trigger action grabs empty panel surface: hold it to translate the panel at the original grab depth, then release to commit the new remembered pose. Button regions win over grabbing, panel orientation stays fixed during this first grab implementation, and pose persistence still happens only when the remembered pose changes rather than once per rendered frame.\n',
              'The positioned panel renders live Nightshift status on a fixed-size dark surface and includes four controller-selectable controls: `SLEEP`, `WAKE`, `DARKER`, and `BRIGHT`. Nightshift uses OpenXR aim poses to ray-test the world-locked quad and renders a lightweight laser beam while a controller is aimed at the panel. Hovered buttons highlight without rerastering for every pointer movement. Trigger/select is reserved for UI activation; on Oculus Touch-compatible profiles the squeeze/grip action is reserved for panel manipulation. Grip captures the full controller-relative transform, so the panel can translate, turn, tilt, and angle naturally while held, then commits the remembered pose once on release. Misses and button gaps remain non-actions rather than snapping. Brightness buttons adjust canonical brightness in 10-percentage-point steps. If controller-action setup is unavailable on a runtime, the status panel continues rendering while interaction is disabled.\n',
              'README interaction behavior')
