name: Apply overlay input polish once

on:
  push:
    branches:
      - prototype/integrated-mvp

permissions:
  contents: write

jobs:
  apply-overlay-input-polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Install Linux system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libopenxr-dev pkg-config
      - name: Apply guarded interaction polish
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, got {count}")
              return text.replace(old, new, 1)

          controller = r'''use anyhow::{Context, Result};
          use openxr as xr;

          use crate::{
              interaction::PanelRay,
              placement::{PanelPose, normalize_quaternion_xyzw},
          };

          #[derive(Clone, Copy, Debug, PartialEq, Eq)]
          pub enum ControllerHand {
              Left,
              Right,
          }

          #[derive(Clone, Copy, Debug, PartialEq)]
          pub struct PointerSample {
              pub hand: ControllerHand,
              pub ray: Option<PanelRay>,
              pub controller_pose: Option<PanelPose>,
              pub trigger_just_pressed: bool,
              pub grip_down: bool,
              pub grip_just_pressed: bool,
              pub grip_just_released: bool,
          }

          pub struct ControllerInput {
              action_set: xr::ActionSet,
              left_aim: xr::Action<xr::Posef>,
              right_aim: xr::Action<xr::Posef>,
              left_grip_pose: xr::Action<xr::Posef>,
              right_grip_pose: xr::Action<xr::Posef>,
              left_trigger: xr::Action<bool>,
              right_trigger: xr::Action<bool>,
              left_grab: xr::Action<bool>,
              right_grab: xr::Action<bool>,
              left_aim_space: xr::Space,
              right_aim_space: xr::Space,
              left_grip_space: xr::Space,
              right_grip_space: xr::Space,
          }

          impl ControllerInput {
              pub fn new(instance: &xr::Instance, session: &xr::Session<xr::Vulkan>) -> Result<Self> {
                  let action_set = instance
                      .create_action_set("nightshift_panel", "Nightshift panel", 0)
                      .context("creating Nightshift panel action set")?;
                  let left_aim = action_set
                      .create_action::<xr::Posef>("left_aim", "Left pointer", &[])
                      .context("creating left pointer pose action")?;
                  let right_aim = action_set
                      .create_action::<xr::Posef>("right_aim", "Right pointer", &[])
                      .context("creating right pointer pose action")?;
                  let left_grip_pose = action_set
                      .create_action::<xr::Posef>("left_grip_pose", "Left grip pose", &[])
                      .context("creating left grip pose action")?;
                  let right_grip_pose = action_set
                      .create_action::<xr::Posef>("right_grip_pose", "Right grip pose", &[])
                      .context("creating right grip pose action")?;
                  let left_trigger = action_set
                      .create_action::<bool>("left_trigger", "Left UI trigger", &[])
                      .context("creating left trigger action")?;
                  let right_trigger = action_set
                      .create_action::<bool>("right_trigger", "Right UI trigger", &[])
                      .context("creating right trigger action")?;
                  let left_grab = action_set
                      .create_action::<bool>("left_grab", "Left panel grab", &[])
                      .context("creating left grab action")?;
                  let right_grab = action_set
                      .create_action::<bool>("right_grab", "Right panel grab", &[])
                      .context("creating right grab action")?;

                  let simple_profile = instance
                      .string_to_path("/interaction_profiles/khr/simple_controller")
                      .context("resolving simple-controller interaction profile")?;
                  instance
                      .suggest_interaction_profile_bindings(
                          simple_profile,
                          &[
                              xr::Binding::new(
                                  &left_aim,
                                  instance.string_to_path("/user/hand/left/input/aim/pose")?,
                              ),
                              xr::Binding::new(
                                  &right_aim,
                                  instance.string_to_path("/user/hand/right/input/aim/pose")?,
                              ),
                              xr::Binding::new(
                                  &left_grip_pose,
                                  instance.string_to_path("/user/hand/left/input/grip/pose")?,
                              ),
                              xr::Binding::new(
                                  &right_grip_pose,
                                  instance.string_to_path("/user/hand/right/input/grip/pose")?,
                              ),
                              xr::Binding::new(
                                  &left_trigger,
                                  instance.string_to_path("/user/hand/left/input/select/click")?,
                              ),
                              xr::Binding::new(
                                  &right_trigger,
                                  instance.string_to_path("/user/hand/right/input/select/click")?,
                              ),
                          ],
                      )
                      .context("suggesting simple-controller panel bindings")?;

                  let touch_profile = instance
                      .string_to_path("/interaction_profiles/oculus/touch_controller")
                      .context("resolving Oculus Touch interaction profile")?;
                  instance
                      .suggest_interaction_profile_bindings(
                          touch_profile,
                          &[
                              xr::Binding::new(
                                  &left_aim,
                                  instance.string_to_path("/user/hand/left/input/aim/pose")?,
                              ),
                              xr::Binding::new(
                                  &right_aim,
                                  instance.string_to_path("/user/hand/right/input/aim/pose")?,
                              ),
                              xr::Binding::new(
                                  &left_grip_pose,
                                  instance.string_to_path("/user/hand/left/input/grip/pose")?,
                              ),
                              xr::Binding::new(
                                  &right_grip_pose,
                                  instance.string_to_path("/user/hand/right/input/grip/pose")?,
                              ),
                              xr::Binding::new(
                                  &left_trigger,
                                  instance.string_to_path("/user/hand/left/input/trigger/value")?,
                              ),
                              xr::Binding::new(
                                  &right_trigger,
                                  instance.string_to_path("/user/hand/right/input/trigger/value")?,
                              ),
                              xr::Binding::new(
                                  &left_grab,
                                  instance.string_to_path("/user/hand/left/input/squeeze/value")?,
                              ),
                              xr::Binding::new(
                                  &right_grab,
                                  instance.string_to_path("/user/hand/right/input/squeeze/value")?,
                              ),
                          ],
                      )
                      .context("suggesting Oculus Touch panel bindings")?;

                  session
                      .attach_action_sets(&[&action_set])
                      .context("attaching Nightshift panel action set")?;
                  let left_aim_space = left_aim
                      .create_space(session, xr::Path::NULL, xr::Posef::IDENTITY)
                      .context("creating left pointer action space")?;
                  let right_aim_space = right_aim
                      .create_space(session, xr::Path::NULL, xr::Posef::IDENTITY)
                      .context("creating right pointer action space")?;
                  let left_grip_space = left_grip_pose
                      .create_space(session, xr::Path::NULL, xr::Posef::IDENTITY)
                      .context("creating left grip action space")?;
                  let right_grip_space = right_grip_pose
                      .create_space(session, xr::Path::NULL, xr::Posef::IDENTITY)
                      .context("creating right grip action space")?;

                  Ok(Self {
                      action_set,
                      left_aim,
                      right_aim,
                      left_grip_pose,
                      right_grip_pose,
                      left_trigger,
                      right_trigger,
                      left_grab,
                      right_grab,
                      left_aim_space,
                      right_aim_space,
                      left_grip_space,
                      right_grip_space,
                  })
              }

              pub fn samples(
                  &self,
                  session: &xr::Session<xr::Vulkan>,
                  display_time: xr::Time,
                  base_space: &xr::Space,
              ) -> Result<[PointerSample; 2]> {
                  session
                      .sync_actions(&[(&self.action_set).into()])
                      .context("synchronizing Nightshift panel actions")?;

                  Ok([
                      sample_hand(
                          ControllerHand::Left,
                          &self.left_aim,
                          &self.left_grip_pose,
                          &self.left_trigger,
                          &self.left_grab,
                          &self.left_aim_space,
                          &self.left_grip_space,
                          session,
                          display_time,
                          base_space,
                      )?,
                      sample_hand(
                          ControllerHand::Right,
                          &self.right_aim,
                          &self.right_grip_pose,
                          &self.right_trigger,
                          &self.right_grab,
                          &self.right_aim_space,
                          &self.right_grip_space,
                          session,
                          display_time,
                          base_space,
                      )?,
                  ])
              }
          }

          #[allow(clippy::too_many_arguments)]
          fn sample_hand(
              hand: ControllerHand,
              aim: &xr::Action<xr::Posef>,
              grip_pose: &xr::Action<xr::Posef>,
              trigger: &xr::Action<bool>,
              grab: &xr::Action<bool>,
              aim_space: &xr::Space,
              grip_space: &xr::Space,
              session: &xr::Session<xr::Vulkan>,
              display_time: xr::Time,
              base_space: &xr::Space,
          ) -> Result<PointerSample> {
              let trigger_state = trigger
                  .state(session, xr::Path::NULL)
                  .context("reading controller trigger action")?;
              let grab_state = grab
                  .state(session, xr::Path::NULL)
                  .context("reading controller grab action")?;
              let trigger_just_pressed = trigger_state.is_active
                  && trigger_state.changed_since_last_sync
                  && trigger_state.current_state;
              let grip_down = grab_state.is_active && grab_state.current_state;
              let grip_just_pressed = grab_state.is_active
                  && grab_state.changed_since_last_sync
                  && grab_state.current_state;
              let grip_just_released = grab_state.changed_since_last_sync && !grab_state.current_state;

              let ray = locate_pose_action(aim, aim_space, session, display_time, base_space)?
                  .and_then(ray_from_pose);
              let controller_pose = locate_pose_action(
                  grip_pose,
                  grip_space,
                  session,
                  display_time,
                  base_space,
              )?
              .and_then(panel_pose_from_xr);

              Ok(PointerSample {
                  hand,
                  ray,
                  controller_pose,
                  trigger_just_pressed,
                  grip_down,
                  grip_just_pressed,
                  grip_just_released,
              })
          }

          fn locate_pose_action(
              action: &xr::Action<xr::Posef>,
              space: &xr::Space,
              session: &xr::Session<xr::Vulkan>,
              display_time: xr::Time,
              base_space: &xr::Space,
          ) -> Result<Option<xr::Posef>> {
              if !action.is_active(session, xr::Path::NULL)? {
                  return Ok(None);
              }
              let location = space
                  .locate(base_space, display_time)
                  .context("locating controller pose")?;
              let valid = location
                  .location_flags
                  .contains(xr::SpaceLocationFlags::POSITION_VALID)
                  && location
                      .location_flags
                      .contains(xr::SpaceLocationFlags::ORIENTATION_VALID);
              Ok(valid.then_some(location.pose))
          }

          fn panel_pose_from_xr(pose: xr::Posef) -> Option<PanelPose> {
              Some(PanelPose {
                  position: [pose.position.x, pose.position.y, pose.position.z],
                  orientation_xyzw: normalize_quaternion_xyzw([
                      pose.orientation.x,
                      pose.orientation.y,
                      pose.orientation.z,
                      pose.orientation.w,
                  ])?,
              })
          }

          fn ray_from_pose(pose: xr::Posef) -> Option<PanelRay> {
              let orientation = normalize_quaternion_xyzw([
                  pose.orientation.x,
                  pose.orientation.y,
                  pose.orientation.z,
                  pose.orientation.w,
              ])?;
              let direction = rotate([0.0, 0.0, -1.0], orientation);
              Some(PanelRay {
                  origin: [pose.position.x, pose.position.y, pose.position.z],
                  direction,
              })
          }

          fn rotate(vector: [f32; 3], quaternion_xyzw: [f32; 4]) -> [f32; 3] {
              let [x, y, z, w] = quaternion_xyzw;
              let q_vector = [x, y, z];
              let twice_cross = [
                  2.0 * (q_vector[1] * vector[2] - q_vector[2] * vector[1]),
                  2.0 * (q_vector[2] * vector[0] - q_vector[0] * vector[2]),
                  2.0 * (q_vector[0] * vector[1] - q_vector[1] * vector[0]),
              ];
              let cross_q_twice_cross = [
                  q_vector[1] * twice_cross[2] - q_vector[2] * twice_cross[1],
                  q_vector[2] * twice_cross[0] - q_vector[0] * twice_cross[2],
                  q_vector[0] * twice_cross[1] - q_vector[1] * twice_cross[0],
              ];
              [
                  vector[0] + w * twice_cross[0] + cross_q_twice_cross[0],
                  vector[1] + w * twice_cross[1] + cross_q_twice_cross[1],
                  vector[2] + w * twice_cross[2] + cross_q_twice_cross[2],
              ]
          }
          '''.replace('          ', '')
          Path('crates/nightshift-overlay-prototype/src/controller_input.rs').write_text(controller)

          interaction = r'''use crate::placement::{PanelPose, normalize_quaternion_xyzw};

          const EPSILON: f32 = 1.0e-5;

          #[derive(Clone, Copy, Debug, PartialEq)]
          pub struct PanelRay {
              pub origin: [f32; 3],
              pub direction: [f32; 3],
          }

          #[derive(Clone, Copy, Debug, PartialEq)]
          pub struct PanelUv {
              pub u: f32,
              pub v: f32,
          }

          #[derive(Clone, Copy, Debug, PartialEq)]
          pub struct PanelHit {
              pub uv: PanelUv,
              pub distance_m: f32,
          }

          #[derive(Clone, Copy, Debug, PartialEq)]
          pub struct PanelGrab {
              relative_position: [f32; 3],
              relative_orientation_xyzw: [f32; 4],
          }

          #[derive(Clone, Copy, Debug, PartialEq, Eq)]
          pub enum PanelAction {
              EnterSleep,
              Wake,
              BrightnessDown,
              BrightnessUp,
          }

          #[derive(Clone, Copy, Debug, PartialEq)]
          struct ButtonRegion {
              action: PanelAction,
              x_min: f32,
              x_max: f32,
              y_min: f32,
              y_max: f32,
          }

          // Keep the interaction regions aligned with the bottom-row buttons rendered by raster.rs.
          // The panel is furniture, not a face-hugger: misses stay misses instead of snapping.
          const BUTTONS: [ButtonRegion; 4] = [
              button(PanelAction::EnterSleep, 36.0, 201.0),
              button(PanelAction::Wake, 213.0, 378.0),
              button(PanelAction::BrightnessDown, 390.0, 555.0),
              button(PanelAction::BrightnessUp, 567.0, 732.0),
          ];

          const fn button(action: PanelAction, x_min: f32, x_max: f32) -> ButtonRegion {
              ButtonRegion {
                  action,
                  x_min: x_min / 768.0,
                  x_max: x_max / 768.0,
                  y_min: 388.0 / 448.0,
                  y_max: 432.0 / 448.0,
              }
          }

          pub fn action_at_uv(uv: PanelUv) -> Option<PanelAction> {
              if !uv.u.is_finite() || !uv.v.is_finite() {
                  return None;
              }
              BUTTONS.iter().find_map(|button| {
                  (uv.u >= button.x_min
                      && uv.u <= button.x_max
                      && uv.v >= button.y_min
                      && uv.v <= button.y_max)
                      .then_some(button.action)
              })
          }

          pub fn begin_panel_grab(controller_pose: PanelPose, panel_pose: PanelPose) -> Option<PanelGrab> {
              let controller_orientation = normalize_quaternion_xyzw(controller_pose.orientation_xyzw)?;
              let panel_orientation = normalize_quaternion_xyzw(panel_pose.orientation_xyzw)?;
              if !controller_pose.position.iter().all(|value| value.is_finite())
                  || !panel_pose.position.iter().all(|value| value.is_finite())
              {
                  return None;
              }
              let inverse_controller = conjugate(controller_orientation);
              Some(PanelGrab {
                  relative_position: rotate(
                      subtract(panel_pose.position, controller_pose.position),
                      inverse_controller,
                  ),
                  relative_orientation_xyzw: normalize_quaternion_xyzw(quaternion_multiply(
                      inverse_controller,
                      panel_orientation,
                  ))?,
              })
          }

          pub fn update_panel_grab(grab: PanelGrab, controller_pose: PanelPose) -> Option<PanelPose> {
              let controller_orientation = normalize_quaternion_xyzw(controller_pose.orientation_xyzw)?;
              if !controller_pose.position.iter().all(|value| value.is_finite()) {
                  return None;
              }
              let orientation_xyzw = normalize_quaternion_xyzw(quaternion_multiply(
                  controller_orientation,
                  grab.relative_orientation_xyzw,
              ))?;
              let position = add(
                  controller_pose.position,
                  rotate(grab.relative_position, controller_orientation),
              );
              position.iter().all(|value| value.is_finite()).then_some(PanelPose {
                  position,
                  orientation_xyzw,
              })
          }

          pub fn hit_test_panel(
              ray: PanelRay,
              panel_pose: PanelPose,
              panel_width_m: f32,
              panel_height_m: f32,
          ) -> Option<PanelUv> {
              hit_test_panel_with_distance(ray, panel_pose, panel_width_m, panel_height_m)
                  .map(|hit| hit.uv)
          }

          pub fn hit_test_panel_with_distance(
              ray: PanelRay,
              panel_pose: PanelPose,
              panel_width_m: f32,
              panel_height_m: f32,
          ) -> Option<PanelHit> {
              if !ray.origin.iter().all(|value| value.is_finite())
                  || !ray.direction.iter().all(|value| value.is_finite())
                  || !panel_pose.position.iter().all(|value| value.is_finite())
                  || !panel_width_m.is_finite()
                  || !panel_height_m.is_finite()
                  || panel_width_m <= EPSILON
                  || panel_height_m <= EPSILON
              {
                  return None;
              }

              let orientation = normalize_quaternion_xyzw(panel_pose.orientation_xyzw)?;
              let inverse = conjugate(orientation);
              let local_origin = rotate(subtract(ray.origin, panel_pose.position), inverse);
              let local_direction = rotate(ray.direction, inverse);

              if local_direction[2].abs() <= EPSILON {
                  return None;
              }

              let distance = -local_origin[2] / local_direction[2];
              if !distance.is_finite() || distance < 0.0 {
                  return None;
              }

              let x = local_origin[0] + local_direction[0] * distance;
              let y = local_origin[1] + local_direction[1] * distance;
              let half_width = panel_width_m * 0.5;
              let half_height = panel_height_m * 0.5;
              if x < -half_width || x > half_width || y < -half_height || y > half_height {
                  return None;
              }

              let world_direction = normalize_direction(ray.direction)?;
              let world_hit = add(ray.origin, scale(world_direction, distance * vector_length(ray.direction)?));
              let world_distance = vector_length(subtract(world_hit, ray.origin))?;
              Some(PanelHit {
                  uv: PanelUv {
                      u: x / panel_width_m + 0.5,
                      v: 0.5 - y / panel_height_m,
                  },
                  distance_m: world_distance,
              })
          }

          fn add(left: [f32; 3], right: [f32; 3]) -> [f32; 3] {
              [left[0] + right[0], left[1] + right[1], left[2] + right[2]]
          }

          fn subtract(left: [f32; 3], right: [f32; 3]) -> [f32; 3] {
              [left[0] - right[0], left[1] - right[1], left[2] - right[2]]
          }

          fn scale(vector: [f32; 3], factor: f32) -> [f32; 3] {
              [vector[0] * factor, vector[1] * factor, vector[2] * factor]
          }

          fn conjugate(quaternion_xyzw: [f32; 4]) -> [f32; 4] {
              [-quaternion_xyzw[0], -quaternion_xyzw[1], -quaternion_xyzw[2], quaternion_xyzw[3]]
          }

          fn quaternion_multiply(left: [f32; 4], right: [f32; 4]) -> [f32; 4] {
              let [ax, ay, az, aw] = left;
              let [bx, by, bz, bw] = right;
              [
                  aw * bx + ax * bw + ay * bz - az * by,
                  aw * by - ax * bz + ay * bw + az * bx,
                  aw * bz + ax * by - ay * bx + az * bw,
                  aw * bw - ax * bx - ay * by - az * bz,
              ]
          }

          fn vector_length(vector: [f32; 3]) -> Option<f32> {
              let length_sq = vector[0] * vector[0] + vector[1] * vector[1] + vector[2] * vector[2];
              if !length_sq.is_finite() || length_sq <= EPSILON * EPSILON {
                  return None;
              }
              Some(length_sq.sqrt())
          }

          fn normalize_direction(direction: [f32; 3]) -> Option<[f32; 3]> {
              let length = vector_length(direction)?;
              Some(scale(direction, length.recip()))
          }

          fn rotate(vector: [f32; 3], quaternion_xyzw: [f32; 4]) -> [f32; 3] {
              let [x, y, z, w] = quaternion_xyzw;
              let q_vector = [x, y, z];
              let twice_cross = [
                  2.0 * (q_vector[1] * vector[2] - q_vector[2] * vector[1]),
                  2.0 * (q_vector[2] * vector[0] - q_vector[0] * vector[2]),
                  2.0 * (q_vector[0] * vector[1] - q_vector[1] * vector[0]),
              ];
              let cross_q_twice_cross = [
                  q_vector[1] * twice_cross[2] - q_vector[2] * twice_cross[1],
                  q_vector[2] * twice_cross[0] - q_vector[0] * twice_cross[2],
                  q_vector[0] * twice_cross[1] - q_vector[1] * twice_cross[0],
              ];
              [
                  vector[0] + w * twice_cross[0] + cross_q_twice_cross[0],
                  vector[1] + w * twice_cross[1] + cross_q_twice_cross[1],
                  vector[2] + w * twice_cross[2] + cross_q_twice_cross[2],
              ]
          }
          '''.replace('          ', '')
          Path('crates/nightshift-overlay-prototype/src/interaction.rs').write_text(interaction)

          laser = r'''use anyhow::{Context, Result, anyhow};
          use ash::vk::{self, Handle};
          use openxr as xr;

          use crate::{interaction::PanelRay, placement::normalize_quaternion_xyzw};

          const LASER_TEXTURE_SIZE: u32 = 1;
          const LASER_THICKNESS_M: f32 = 0.004;
          const EPSILON: f32 = 1.0e-5;

          #[derive(Clone, Copy, Debug, PartialEq)]
          pub struct LaserSegment {
              pub ray: PanelRay,
              pub distance_m: f32,
          }

          pub struct LaserRenderer {
              swapchain: xr::Swapchain<xr::Vulkan>,
              images: Vec<vk::Image>,
              rect: xr::Rect2Di,
              subresource: vk::ImageSubresourceRange,
              initialized: bool,
          }

          impl LaserRenderer {
              pub fn new(session: &xr::Session<xr::Vulkan>, format: vk::Format) -> Result<Self> {
                  let swapchain = session
                      .create_swapchain(&xr::SwapchainCreateInfo {
                          create_flags: xr::SwapchainCreateFlags::EMPTY,
                          usage_flags: xr::SwapchainUsageFlags::COLOR_ATTACHMENT
                              | xr::SwapchainUsageFlags::TRANSFER_DST,
                          format: format.as_raw() as u32,
                          sample_count: 1,
                          width: LASER_TEXTURE_SIZE,
                          height: LASER_TEXTURE_SIZE,
                          face_count: 1,
                          array_size: 1,
                          mip_count: 1,
                      })
                      .context("creating laser swapchain")?;
                  let images = swapchain
                      .enumerate_images()
                      .context("enumerating laser swapchain images")?
                      .into_iter()
                      .map(vk::Image::from_raw)
                      .collect::<Vec<_>>();
                  Ok(Self {
                      swapchain,
                      images,
                      rect: xr::Rect2Di {
                          offset: xr::Offset2Di { x: 0, y: 0 },
                          extent: xr::Extent2Di {
                              width: LASER_TEXTURE_SIZE as i32,
                              height: LASER_TEXTURE_SIZE as i32,
                          },
                      },
                      subresource: vk::ImageSubresourceRange {
                          aspect_mask: vk::ImageAspectFlags::COLOR,
                          base_mip_level: 0,
                          level_count: 1,
                          base_array_layer: 0,
                          layer_count: 1,
                      },
                      initialized: false,
                  })
              }

              pub unsafe fn ensure_initialized(
                  &mut self,
                  device: &ash::Device,
                  queue: vk::Queue,
                  command_buffer: vk::CommandBuffer,
                  fence: vk::Fence,
              ) -> Result<()> {
                  if self.initialized {
                      return Ok(());
                  }
                  let image_index = self.swapchain.acquire_image().context("acquiring laser image")?;
                  self.swapchain
                      .wait_image(xr::Duration::INFINITE)
                      .context("waiting for laser image")?;
                  let result = (|| -> Result<()> {
                      let image = *self
                          .images
                          .get(image_index as usize)
                          .ok_or_else(|| anyhow!("runtime returned invalid laser image index {image_index}"))?;
                      device.wait_for_fences(&[fence], true, u64::MAX)?;
                      device.reset_fences(&[fence])?;
                      device.reset_command_buffer(command_buffer, vk::CommandBufferResetFlags::empty())?;
                      device.begin_command_buffer(
                          command_buffer,
                          &vk::CommandBufferBeginInfo::default()
                              .flags(vk::CommandBufferUsageFlags::ONE_TIME_SUBMIT),
                      )?;
                      let to_transfer = [vk::ImageMemoryBarrier::default()
                          .dst_access_mask(vk::AccessFlags::TRANSFER_WRITE)
                          .old_layout(vk::ImageLayout::UNDEFINED)
                          .new_layout(vk::ImageLayout::TRANSFER_DST_OPTIMAL)
                          .src_queue_family_index(vk::QUEUE_FAMILY_IGNORED)
                          .dst_queue_family_index(vk::QUEUE_FAMILY_IGNORED)
                          .image(image)
                          .subresource_range(self.subresource)];
                      device.cmd_pipeline_barrier(
                          command_buffer,
                          vk::PipelineStageFlags::TOP_OF_PIPE,
                          vk::PipelineStageFlags::TRANSFER,
                          vk::DependencyFlags::empty(),
                          &[],
                          &[],
                          &to_transfer,
                      );
                      device.cmd_clear_color_image(
                          command_buffer,
                          image,
                          vk::ImageLayout::TRANSFER_DST_OPTIMAL,
                          &vk::ClearColorValue {
                              float32: [0.72, 0.42, 1.0, 0.92],
                          },
                          &[self.subresource],
                      );
                      let to_compositor = [vk::ImageMemoryBarrier::default()
                          .src_access_mask(vk::AccessFlags::TRANSFER_WRITE)
                          .dst_access_mask(vk::AccessFlags::COLOR_ATTACHMENT_READ)
                          .old_layout(vk::ImageLayout::TRANSFER_DST_OPTIMAL)
                          .new_layout(vk::ImageLayout::COLOR_ATTACHMENT_OPTIMAL)
                          .src_queue_family_index(vk::QUEUE_FAMILY_IGNORED)
                          .dst_queue_family_index(vk::QUEUE_FAMILY_IGNORED)
                          .image(image)
                          .subresource_range(self.subresource)];
                      device.cmd_pipeline_barrier(
                          command_buffer,
                          vk::PipelineStageFlags::TRANSFER,
                          vk::PipelineStageFlags::COLOR_ATTACHMENT_OUTPUT,
                          vk::DependencyFlags::empty(),
                          &[],
                          &[],
                          &to_compositor,
                      );
                      device.end_command_buffer(command_buffer)?;
                      let command_buffers = [command_buffer];
                      let submits = [vk::SubmitInfo::default().command_buffers(&command_buffers)];
                      device.queue_submit(queue, &submits, fence)?;
                      device.wait_for_fences(&[fence], true, u64::MAX)?;
                      Ok(())
                  })();
                  let release = self.swapchain.release_image().context("releasing laser image");
                  result?;
                  release?;
                  self.initialized = true;
                  Ok(())
              }

              pub fn layers<'a>(
                  &'a self,
                  space: &'a xr::Space,
                  segment: LaserSegment,
              ) -> Option<[xr::CompositionLayerQuad<'a, xr::Vulkan>; 2]> {
                  let (first_pose, second_pose, length) = laser_poses(segment)?;
                  let make_layer = |pose| {
                      xr::CompositionLayerQuad::new()
                          .layer_flags(xr::CompositionLayerFlags::BLEND_TEXTURE_SOURCE_ALPHA)
                          .pose(pose)
                          .sub_image(
                              xr::SwapchainSubImage::new()
                                  .swapchain(&self.swapchain)
                                  .image_array_index(0)
                                  .image_rect(self.rect),
                          )
                          .eye_visibility(xr::EyeVisibility::BOTH)
                          .space(space)
                          .size(xr::Extent2Df {
                              width: length,
                              height: LASER_THICKNESS_M,
                          })
                  };
                  Some([make_layer(first_pose), make_layer(second_pose)])
              }
          }

          fn laser_poses(segment: LaserSegment) -> Option<(xr::Posef, xr::Posef, f32)> {
              if !segment.distance_m.is_finite() || segment.distance_m <= EPSILON {
                  return None;
              }
              let direction = normalize(segment.ray.direction)?;
              if !segment.ray.origin.iter().all(|value| value.is_finite()) {
                  return None;
              }
              let midpoint = [
                  segment.ray.origin[0] + direction[0] * segment.distance_m * 0.5,
                  segment.ray.origin[1] + direction[1] * segment.distance_m * 0.5,
                  segment.ray.origin[2] + direction[2] * segment.distance_m * 0.5,
              ];
              let base = quaternion_from_x_axis(direction)?;
              let quarter_turn_x = [std::f32::consts::FRAC_1_SQRT_2, 0.0, 0.0, std::f32::consts::FRAC_1_SQRT_2];
              let crossed = normalize_quaternion_xyzw(quaternion_multiply(base, quarter_turn_x))?;
              Some((xr_pose(midpoint, base), xr_pose(midpoint, crossed), segment.distance_m))
          }

          fn xr_pose(position: [f32; 3], orientation: [f32; 4]) -> xr::Posef {
              xr::Posef {
                  orientation: xr::Quaternionf {
                      x: orientation[0],
                      y: orientation[1],
                      z: orientation[2],
                      w: orientation[3],
                  },
                  position: xr::Vector3f {
                      x: position[0],
                      y: position[1],
                      z: position[2],
                  },
              }
          }

          fn quaternion_from_x_axis(direction: [f32; 3]) -> Option<[f32; 4]> {
              let dot = direction[0];
              if dot < -0.9999 {
                  return Some([0.0, 1.0, 0.0, 0.0]);
              }
              let cross = [0.0, -direction[2], direction[1]];
              normalize_quaternion_xyzw([cross[0], cross[1], cross[2], 1.0 + dot])
          }

          fn quaternion_multiply(left: [f32; 4], right: [f32; 4]) -> [f32; 4] {
              let [ax, ay, az, aw] = left;
              let [bx, by, bz, bw] = right;
              [
                  aw * bx + ax * bw + ay * bz - az * by,
                  aw * by - ax * bz + ay * bw + az * bx,
                  aw * bz + ax * by - ay * bx + az * bw,
                  aw * bw - ax * bx - ay * by - az * bz,
              ]
          }

          fn normalize(vector: [f32; 3]) -> Option<[f32; 3]> {
              if !vector.iter().all(|value| value.is_finite()) {
                  return None;
              }
              let length_sq = vector[0] * vector[0] + vector[1] * vector[1] + vector[2] * vector[2];
              if !length_sq.is_finite() || length_sq <= EPSILON * EPSILON {
                  return None;
              }
              let inverse = length_sq.sqrt().recip();
              Some([vector[0] * inverse, vector[1] * inverse, vector[2] * inverse])
          }

