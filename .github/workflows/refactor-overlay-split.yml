name: Refactor overlay split

on:
  push:
    branches:
      - refactor/split-massive-files

permissions:
  contents: write

jobs:
  split:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/split-massive-files
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Split overlay runtime and raster modules
        run: python3 .github/refactor_overlay_split.py
      - name: Format split modules
        run: |
          rustfmt --edition 2024 \
            crates/nightshift-overlay-prototype/src/main.rs \
            crates/nightshift-overlay-prototype/src/ipc.rs \
            crates/nightshift-overlay-prototype/src/runtime.rs \
            crates/nightshift-overlay-prototype/src/runtime_state.rs \
            crates/nightshift-overlay-prototype/src/raster.rs \
            crates/nightshift-overlay-prototype/src/raster/home.rs \
            crates/nightshift-overlay-prototype/src/raster/settings.rs \
            crates/nightshift-overlay-prototype/src/raster/primitives.rs \
            crates/nightshift-overlay-prototype/src/raster/font.rs
      - name: Commit structural split
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/nightshift-overlay-prototype/src
          git commit -m 'Split overlay runtime and raster modules'
          git push origin HEAD:refactor/split-massive-files
