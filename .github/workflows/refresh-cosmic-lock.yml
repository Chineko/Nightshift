name: Refresh cosmic-text lockfile

on:
  push:
    branches:
      - prototype/ui-cosmic-text

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: prototype/ui-cosmic-text

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Generate Cargo lockfile
        run: cargo generate-lockfile

      - name: Commit Cargo lockfile when needed
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock is already current. The typesetters found no loose paperwork."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "Update Cargo lockfile for cosmic-text"
          git push origin HEAD:prototype/ui-cosmic-text
