name: Nightshift CI

on:
  push:
    branches:
      - main
      - prototype/**
      - bootstrap/**
  pull_request:

jobs:
  core-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Test protocol compatibility
        run: cargo test -p nightshift-protocol

      - name: Test invite rules
        run: cargo test -p nightshift-invites

      - name: Test GoGo presets
        run: cargo test -p nightshift-gogo

      - name: Test OSC script engine
        run: cargo test -p nightshift-osc-script

      - name: Test sleeping-pose classifier
        run: cargo test -p nightshift-pose

      - name: Test daemon state machine
        run: cargo test -p nightshift-daemon

      - name: Check overlay
        run: cargo check -p nightshift-overlay

      - name: Check desktop UI
        run: cargo check -p nightshift-ui

      - name: Check CLI
        run: cargo check -p nightshiftctl

      - name: Test OSC worker
        run: cargo test -p nightshift-osc
