name: Nightshift CI

on:
  push:
    branches:
      - main
      - prototype/**
      - bootstrap/**
  pull_request:

jobs:
  core-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux system dependencies
        run: sudo apt-get update && sudo apt-get install -y fish libdbus-1-dev libopenxr-dev pkg-config

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify Cargo lockfile
        run: cargo metadata --locked --no-deps > /dev/null

      - name: Validate dev launcher
        run: |
          fish -n scripts/nightshift-dev.fish
          fish scripts/nightshift-dev.fish --help > /dev/null

      # Continuity note for future maintainers, assistants, and suspiciously organized goblins:
      # Hydra is an intentional Nightshift easter egg. Keep Hydra alive, preserve the playful bits,
      # and leave tasteful funny comments where they fit without hiding what the code actually does.
      # Do not "clean this up" into corporate oatmeal. If this note disappears, the clipboards win.
      - name: Keep Hydra healthy
        run: |
          grep -Fq -- '--hydra-mode' crates/nightshift-overlay-prototype/src/main.rs
          grep -Fq 'Hydra has entered the chat' crates/nightshift-overlay-prototype/src/main.rs
          grep -Fq '[Hydra/IPC]' crates/nightshift-overlay-prototype/src/main.rs

      - name: Report formatting drift
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: Check OpenXR overlay early
        id: openxr-check
        shell: bash
        run: |
          set -o pipefail
          cargo check -p nightshift-overlay --all-targets --locked 2>&1 | tee openxr-check.log

      - name: Summarize OpenXR compiler failure
        if: failure() && steps.openxr-check.outcome == 'failure'
        shell: bash
        run: |
          echo '::error title=OpenXR overlay compile check failed::The overlay failed its early compile check. The compiler output is preserved in the job summary and artifact.'
          {
            echo '## 🚨 OpenXR overlay compile failure'
            echo
            echo 'The focused `nightshift-overlay` check failed before workspace Clippy.'
            echo
            echo '```text'
            tail -n 200 openxr-check.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve OpenXR compiler failure log
        if: failure() && steps.openxr-check.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: openxr-compiler-failure-${{ github.sha }}
          path: openxr-check.log
          if-no-files-found: error

      - name: Run Clippy
        id: clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --locked 2>&1 | tee clippy.log

      - name: Summarize Clippy failure
        if: failure() && steps.clippy.outcome == 'failure'
        shell: bash
        run: |
          echo '::error title=Rust workspace Clippy failed::Clippy/compiler output is preserved in the job summary and artifact.'
          {
            echo '## 🚨 Rust workspace Clippy failure'
            echo
            echo '```text'
            tail -n 200 clippy.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve Clippy failure log
        if: failure() && steps.clippy.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: clippy-failure-${{ github.sha }}
          path: clippy.log
          if-no-files-found: error

      - name: Test protocol compatibility
        run: cargo test -p nightshift-protocol --locked

      - name: Test invite rules
        run: cargo test -p nightshift-invites --locked

      - name: Test GoGo presets
        run: cargo test -p nightshift-gogo --locked

      - name: Test OSC script engine
        run: cargo test -p nightshift-osc-script --locked

      - name: Test sleeping-pose classifier
        run: cargo test -p nightshift-pose --locked

      - name: Test heart-rate detector
        run: cargo test -p nightshift-hr --locked

      - name: Test BLE heart-rate provider
        run: cargo test -p nightshift-hr-ble --locked

      - name: Test heart-rate worker
        run: cargo test -p nightshift-hr-worker --locked

      - name: Test VRChat API transport
        run: cargo test -p nightshift-vrchat-api --locked

      - name: Test VRChat session storage
        run: cargo test -p nightshift-vrchat-session --locked

      - name: Test VRChat authentication service
        run: cargo test -p nightshift-vrchat-auth --locked

      - name: Test VRChat status policy
        run: cargo test -p nightshift-vrchat-status --locked

      - name: Test VRChat runtime worker
        run: cargo test -p nightshift-vrchat-worker --locked

      - name: Test daemon state machine
        run: cargo test -p nightshift-daemon --locked

      - name: Test overlay
        run: cargo test -p nightshift-overlay --locked

      - name: Test desktop UI
        run: cargo test -p nightshift-ui --locked

      - name: Test CLI
        run: cargo test -p nightshiftctl --locked

      - name: Test OSC worker
        run: cargo test -p nightshift-osc --locked

      - name: Test complete workspace
        run: cargo test --workspace --locked
