[package]
name = "nightshift-overlay"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
ash = { version = "0.38", default-features = false, features = ["loaded"] }
cosmic-text = { version = "0.19", default-features = false, features = ["std", "swash"] }
ctrlc = "3.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
nightshift-pose = { path = "../nightshift-pose" }
nightshift-protocol = { path = "../nightshift-protocol" }
nightshift-vrchat-auth = { path = "../nightshift-vrchat-auth" }
openxr = { version = "0.21.1", features = ["linked"] }
serde_json.workspace = true
taffy = { version = "0.15", default-features = false, features = ["std", "taffy_tree", "flexbox"] }
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }
