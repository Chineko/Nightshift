[workspace]
members = [
    "crates/nightshift-protocol",
    "crates/nightshift-daemon",
    "crates/nightshift-ui",
    "crates/nightshift-overlay-prototype",
    "crates/nightshiftctl",
    "crates/nightshift-osc",
    "crates/nightshift-invites",
    "crates/nightshift-gogo",
    "crates/nightshift-osc-script",
    "crates/nightshift-pose",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/Chineko/Nightshift"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "signal", "fs", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
